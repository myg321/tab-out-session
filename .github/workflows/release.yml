name: Build & Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Extension Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Extension Bundle
        working-directory: extension-react
        run: |
          npm install
          npm run build

      - name: Archive Dist Bundle
        working-directory: extension-react/dist
        run: zip -r ../../tab-out-session-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tab-out-session-${{ github.ref_name }}.zip
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
